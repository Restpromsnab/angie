events {
    worker_connections 1024;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/angie/access.log main;
    error_log /var/log/angie/error.log warn;

    # Основные настройки производительности
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # Кэширование файлов в памяти
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    server {
        listen 80;
        server_name localhost;

        # Безопасность: скрыть версию Angie
        server_tokens off;

        # Базовые заголовки безопасности
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Оптимизация для изображений (более специфичный location должен быть первым)
        location /static/images/ {
            alias /app/static/images/;
            
            # Долгосрочное кэширование для изображений с версионированием
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            
            # Оптимизация доставки изображений
            expires 1y;
            access_log off;
            
            # Обработка отсутствующих файлов
            try_files $uri =404;
        }

        # Общая статика (другие файлы)
        location /static/ {
            alias /app/static/;
            
            # Кэширование для остальной статики
            add_header Cache-Control "public, max-age=86400" always;
            expires 1d;
            
            # Обработка отсутствующих файлов
            try_files $uri =404;
        }

        # Запрет доступа к скрытым файлам
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}